
name: CrewPulse Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crewpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crewpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/crewpulse_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database tables and sample data
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d crewpulse_test \
            -v ON_ERROR_STOP=1 \
            -f sql/test_database_setup.sql

      - name: Run automated tests
        run: python -m pytest -v tests/

      - name: Run data quality monitoring
        run: python src/run_data_quality_checks.py


      - name: Verify monitoring results
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d crewpulse_test \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT COUNT(*) FROM ops.pipeline_runs WHERE pipeline_name = 'crew_pulse_data_quality' AND run_status = 'SUCCESS';" \
            > /tmp/success-count.txt

          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d crewpulse_test \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT COUNT(*) FROM ops.data_quality_results WHERE check_status <> 'PASS';" \
            > /tmp/failed-check-count.txt

          test "$(cat /tmp/success-count.txt)" -ge 1
          test "$(cat /tmp/failed-check-count.txt)" -eq 0

          echo "Monitoring run succeeded and all recorded checks passed."
